<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
  <title id="title">LOOP workflow</title>
  <desc id="desc">The source is cut, its two sections are swapped, the middle join is crossfaded, and the result loops.</desc>
  <rect width="960" height="210" rx="20" fill="#171717"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
