<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
  <title id="title">TEXTURE workflow</title>
  <desc id="desc">Useful texture is picked from non-loop-ready source material, its large rises and falls are softened, compatible pieces are joined, and the result loops.</desc>
  <rect width="960" height="210" rx="20" fill="#171717"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
