    <path d="M960 74C916 54 827 54 783 74" fill="none" stroke="#c2412d" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="872" y="70" font-size="10.5" text-anchor="middle" fill="#475569">结尾同时与开头比较</text>
    <text x="875" y="202" font-size="10.5" text-anchor="middle" fill="#475569">在精确时长内重叠拼接各区域</text>

