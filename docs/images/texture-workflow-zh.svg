<svg xmlns="http://www.w3.org/2000/svg" width="960" height="205" viewBox="0 0 960 205" role="img" aria-labelledby="title desc">
  <title id="title">TEXTURE 工作流程</title>
  <desc id="desc">四个对齐步骤展示不适合直接循环的原素材、纹理采集、平滑组装，以及完成的循环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="205" fill="#ffffff"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#111827">
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="120" y="28">1. 原素材</text>
      <text x="360" y="28">2. 采集纹理</text>
      <text x="600" y="28">3. 平滑组装</text>
      <text x="840" y="28">4. 完成循环</text>
    </g>
    <g fill="#ffffff" stroke="#9ca3af" stroke-width="1.5">
      <rect x="30" y="58" width="180" height="92"/>
      <rect x="270" y="58" width="180" height="92"/>
      <rect x="510" y="58" width="180" height="92"/>
      <rect x="750" y="58" width="180" height="92"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
      <path d="M42 116 C55 115 66 107 78 86 S101 69 113 98 S136 141 149 120 S173 82 185 97 S196 117 198 116" stroke="#1f2937"/>
      <path d="M282 116 C295 115 306 107 318 86 S341 69 353 98 S376 141 389 120 S413 82 425 97 S436 117 438 116" stroke="#1f2937"/>
      <rect x="291" y="65" width="35" height="78" fill="#f4ead2" fill-opacity="0.55" stroke="#b7791f" stroke-width="1"/>
      <rect x="344" y="65" width="35" height="78" fill="#f5e6df" fill-opacity="0.55" stroke="#c2412d" stroke-width="1"/>
      <rect x="397" y="65" width="35" height="78" fill="#f4ead2" fill-opacity="0.55" stroke="#b7791f" stroke-width="1"/>
      <path d="M522 106 C534 91 546 121 558 98 S582 88 594 110" stroke="#b7791f"/>
      <path d="M582 110 C594 91 606 120 618 99 S642 90 654 109 S672 115 678 101" stroke="#c2412d"/>
      <rect x="579" y="68" width="18" height="72" fill="#f5e6df" stroke="none"/>
      <path d="M580 119 C586 96 591 96 597 119" stroke="#6b7280" stroke-width="1.8"/>
      <path d="M762 106 C774 91 786 121 798 98 S822 88 834 110 S858 91 870 102 S897 119 918 105" stroke="#1f2937"/>
      <path d="M762 67 V141 M918 67 V141" stroke="#c2412d" stroke-width="2"/>
      <circle cx="762" cy="106" r="3.5" fill="#c2412d" stroke="none"/>
      <circle cx="918" cy="105" r="3.5" fill="#c2412d" stroke="none"/>
      <path d="M220 104 H255" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
      <path d="M460 104 H495" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
      <path d="M700 104 H735" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
    </g>
    <g fill="#4b5563" font-size="12" text-anchor="middle">
      <text x="120" y="181">原始形态不适合直接循环</text>
      <text x="360" y="181">保留可用的声音细节</text>
      <text x="600" y="181">减弱大起大落并平滑连接</text>
      <text x="840" y="181">形成连续的源素材纹理</text>
    </g>
  </g>
</svg>
