      <g fill="#334155"><text x="548" y="108">1</text><text x="579" y="108">2</text><text x="610" y="108">3</text><text x="641" y="108">4</text><text x="672" y="108">5</text><text x="703" y="108">6</text></g>
      <text x="625" y="151" fill="#64748b">选中顺序</text>
      <text x="625" y="173" fill="#111827" font-size="13" font-weight="700">2 → 5 → 1 → 4</text>
      <text x="625" y="204" fill="#475569">接续平滑 · 电平稳定 · 避免近期重复</text>
    </g>

    <g transform="translate(780 130) scale(.86 .78)" fill="none" stroke="#334155" stroke-width="1.8"><use href="#steadyWave"/></g>
