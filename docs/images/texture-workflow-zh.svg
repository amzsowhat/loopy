  </defs>
  <rect width="1000" height="230" fill="#fff"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#111827">
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="125" y="25">1. 选择素材</text><text x="375" y="25">2. 控制包络</text>
      <text x="625" y="25">3. 选择片段</text><text x="875" y="25">4. 组装循环</text>
    </g>
    <g fill="none" stroke="#cbd5e1" stroke-width="1.2">
      <rect x="20" y="48" width="210" height="174"/><rect x="270" y="48" width="210" height="174"/>
      <rect x="520" y="48" width="210" height="174"/><rect x="770" y="48" width="210" height="174"/>
    </g>

    <g transform="translate(30 130) scale(.86 .92)" fill="none" stroke="#334155" stroke-width="1.8"><use href="#sourceWave"/></g>
    <path d="M32 95C73 91 85 62 126 61S177 91 218 96M32 165C73 169 85 198 126 199S177 169 218 164" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M32 64V196M218 64V196" stroke="#c2412d" stroke-width="1.5"/>
    <g font-size="10.5" fill="#475569"><text x="35" y="59">入点</text><text x="202" y="59">出点</text><text x="126" y="213" text-anchor="middle">源波形与缓慢包络</text></g>

    <g transform="translate(280 130) scale(.86 .92)" fill="none" stroke="#334155" stroke-width="1.8"><use href="#steadyWave"/></g>
    <path d="M282 98C330 86 420 86 468 98M282 162C330 174 420 174 468 162" fill="none" stroke="#b45309" stroke-width="1.3"/>
    <path d="M282 95C323 91 335 62 376 61S427 91 468 96M282 165C323 169 335 198 376 199S427 169 468 164" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 3"/>
