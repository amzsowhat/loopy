<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">TEXTURE 如何处理音频</title>
  <desc id="desc">TEXTURE 使用选定波形，减弱缓慢的包络起伏，将素材划分为重叠区域，按照接续连续性和近期使用情况选择区域，再将它们环形组装为精确时长的输出，最后应用可选的动态与声音性格处理。</desc>
  <defs>
    <path id="sourceWave" d="M0-4V4 M4-9V9 M8-4V4 M12-6V6 M16-9V9 M20-10V10 M24-8V8 M28-9V9 M32-10V10 M36-7V7 M40-18V18 M44-11V11 M48-14V14 M52-11V11 M56-17V17 M60-18V18 M64-24V24 M68-14V14 M72-14V14 M76-26V26 M80-17V17 M84-30V30 M88-19V19 M92-22V22 M96-23V23 M100-34V34 M104-18V18 M108-28V28 M112-21V21 M116-17V17 M120-35V35 M124-27V27 M128-25V25 M132-14V14 M136-30V30 M140-23V23 M144-41V41 M148-16V16 M152-25V25 M156-32V32 M160-28V28 M164-32V32 M168-25V25 M172-19V19 M176-14V14 M180-23V23 M184-8V8 M188-14V14 M192-7V7 M196-8V8 M200-11V11 M204-10V10 M208-6V6 M212-5V5 M216-7V7 M220-4V4"/>
