name: Build Windows VST3

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset vs2022-debug

      - name: Build
        run: cmake --build --preset build-debug --config Debug --parallel

      - name: Test
        run: ctest --preset test-debug -C Debug --output-on-failure

