name: Build downloadable Windows VST3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "plugins/loop-surgeon/**"
      - ".github/workflows/build-windows-release.yml"
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "plugins/loop-surgeon/**"
      - ".github/workflows/build-windows-release.yml"

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake --preset vs2022-release

      - name: Build VST3 and Standalone
        run: cmake --build --preset build-release --config Release --parallel

      - name: Run engine tests
        run: ctest --preset test-release --output-on-failure

      - name: Package VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $plugin = "build/vs2022/plugins/loop-surgeon/LoopSurgeon_artefacts/Release/VST3/Loop Surgeon.vst3"
          if (-not (Test-Path -LiteralPath $plugin)) { throw "VST3 bundle not found: $plugin" }
          Compress-Archive -LiteralPath $plugin -DestinationPath "Loop-Surgeon-Windows-x64-VST3.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loop-Surgeon-Windows-x64-VST3
          path: Loop-Surgeon-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows package to alpha release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh release upload "v0.2.0-alpha" "Loop-Surgeon-Windows-x64-VST3.zip" --clobber
          git tag "v0.2.0-alpha-windows-ready" $env:GITHUB_SHA
          git push origin "refs/tags/v0.2.0-alpha-windows-ready" --force
