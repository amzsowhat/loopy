name: Build downloadable Windows VST3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loop-surgeon-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake --preset vs2022-release

      - name: Build VST3 and Standalone
        run: cmake --build --preset build-release --config Release --parallel

      - name: Run engine tests
        run: ctest --preset test-release --output-on-failure

      - name: Package VST3 and PC guide
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "plugins/loop-surgeon/scripts/package-windows.ps1" -Version "0.6.0-pre"
          Copy-Item -LiteralPath "build/packages/Loop-Surgeon-0.6.0-pre-Windows-x64-VST3.zip" -Destination "Loop-Surgeon-Windows-x64-VST3.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loop-Surgeon-Windows-x64-VST3
          path: Loop-Surgeon-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows package to pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.6.0-pre"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --target $env:GITHUB_SHA --title "Loop Surgeon 0.6.0 Pre-release" --notes "Adds equal Rotate & Repair and Texture Loop workflows, Flatten and Source Match, circular true-peak/QC, analysis views, portable recall, and DAW drag. Requires host validation before sale." --prerelease
          }
          gh release upload $tag "Loop-Surgeon-Windows-x64-VST3.zip" --clobber
          git tag "v0.6.0-pre-windows-ready" $env:GITHUB_SHA
          git push origin "refs/tags/v0.6.0-pre-windows-ready" --force
